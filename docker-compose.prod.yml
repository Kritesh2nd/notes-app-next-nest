version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blueprint_notes
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - backend_logs:/app/logs
    environment:
      PORT: "4000"
      NODE_ENV: "production"
      LOG_LEVEL: "info"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/blueprint_notes?schema=public"
      TYPEORM_SYNC: "true"
      JWT_SECRET: "change-this-to-a-long-random-string"
      JWT_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost:3000"
      APP_URL: "http://localhost:3000"
      APP_NAME: "Blueprint Notes"
      ADMIN_EMAIL: "admin@blueprint-notes.dev"
      ADMIN_PASSWORD: "Admin@12345"
      ADMIN_NAME: "Site Admin"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: "Blueprint Notes <no-reply@blueprint-notes.dev>"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"

volumes:
  db_data:
